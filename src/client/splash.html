<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Here Lies</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: #0a0a0a;
      color: #f5f1e8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 512px;
      padding: 1rem;
    }
    
    .splash {
      text-align: center;
      max-width: 400px;
    }
    
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }
    
    .meta {
      font-size: 0.9rem;
      opacity: 0.7;
      margin-bottom: 1.5rem;
    }
    
    .stats {
      margin: 1.5rem 0;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
    }
    
    button {
      background: #f4a460;
      color: #0a0a0a;
      border: none;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s;
      min-width: 160px;
      min-height: 44px;
    }
    
    button:hover {
      transform: scale(1.02);
    }
    
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="splash">
    <h1>Here Lies</h1>
    <div class="meta">Crypt #1 · Monday · The Whispering Vault</div>
    <div class="stats">
      <div>Setting up...</div>
    </div>
    <button onclick="window.location.href='game.html'">Descend</button>
  </div>
